<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>계약전력 계산기</title>
<meta name="description" content="사용 설비의 소비전력으로 필요한 계약 전력(kW)을 계산해요.">
<meta name="theme-color" content="#E9ECF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="계약전력">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#E9ECF8; --surface:#FFFFFF; --ink:#12163A; --muted:#6A7094; --line:#DDE1F2;
  --field:#F2F4FB; --brand:#4B3BFF; --on-brand:#FFFFFF;
  --hero:#1A1463; --hero-ink:#FFFFFF; --hero-muted:#A9A5E6; --hero-line:rgba(255,255,255,.16);
  --danger:#E5484D;
  --r-hero:30px; --r-card:24px; --r-field:14px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C0E22; --surface:#171A3B; --ink:#EEF0FF; --muted:#9097C4; --line:#262A57;
    --field:#0F1230; --brand:#8A7DFF; --on-brand:#0C0E22;
    --hero:#3A2EE0; --hero-muted:#C9C5FF; --danger:#FF7B80;
  }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:16px;line-height:1.5;min-height:100vh;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{max-width:560px;margin:0 auto;display:grid;gap:14px}
@media (min-width:920px){
  .app{max-width:980px;grid-template-columns:400px 1fr;align-items:start;column-gap:20px}
  .top,.mode{grid-column:1/-1}
  .mode{max-width:360px}
  .hero{position:sticky;top:20px}
}

.mode{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--surface);
}
.mode button{
  height:44px;border-radius:999px;font-size:16px;font-weight:750;color:var(--muted);
  transition:background .15s,color .15s;
}
.mode button[aria-checked="true"]{background:var(--brand);color:var(--on-brand)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:11px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.install{
  display:none;padding:8px 14px;border-radius:999px;background:var(--surface);
  font-size:14px;font-weight:700;color:var(--brand);
}
.install.show{display:inline-block}

/* 결과 카드 */
.hero{
  background:var(--hero);color:var(--hero-ink);border-radius:var(--r-hero);
  padding:26px 24px 22px;overflow:hidden;
}
.hero .label{font-size:15px;font-weight:600;color:var(--hero-muted)}
.big{display:flex;align-items:baseline;gap:8px;margin:4px 0 2px}
.big output{
  font-size:clamp(64px,21vw,92px);font-weight:800;line-height:1;
  letter-spacing:-.045em;font-variant-numeric:tabular-nums;
}
.big span{font-size:26px;font-weight:700;color:var(--hero-muted)}

.bar{
  display:flex;gap:3px;height:14px;margin:22px 0 6px;border-radius:999px;overflow:hidden;
  background:var(--hero-line);
}
.bar i{display:block;min-width:4px;background:var(--c);transition:flex-basis .35s ease}
.bar-cap{font-size:13px;color:var(--hero-muted)}

.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border-top:1px solid var(--hero-line)}
.stats div{padding-top:16px}
.stats div+div{padding-left:18px;border-left:1px solid var(--hero-line)}
.stats dt{font-size:13px;color:var(--hero-muted)}
.stats dd{margin:2px 0 0;font-size:22px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats dd small{font-size:13px;font-weight:600;color:var(--hero-muted);margin-left:3px}


/* 일반 카드 */
.card{background:var(--surface);border-radius:var(--r-card);padding:20px}
.card h2{font-size:17px;font-weight:750;letter-spacing:-.01em}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hint{font-size:13px;color:var(--muted)}


/* 항목 */
.list{display:grid;gap:10px}
.row{
  --c:#7C6CFF;
  background:var(--field);border-radius:var(--r-field);padding:12px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 10px;
}
.row .dot{width:12px;height:12px;border-radius:50%;background:var(--c);margin-left:2px}
.row .name{
  min-width:0;width:100%;height:40px;padding:0 4px;border:0;background:transparent;
  font-size:16px;font-weight:650;border-radius:8px;
}
.row .name::placeholder{color:var(--muted);font-weight:500}
.row .del{
  width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:22px;line-height:1;
}
.row .del:hover,.row .del:focus-visible{color:var(--danger)}
.meta{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.num{
  display:flex;align-items:center;height:44px;padding:0 12px;border-radius:12px;background:var(--surface);
}
.num:focus-within{outline:2px solid var(--brand)}
.num input{
  min-width:0;width:100%;border:0;background:transparent;outline:0;text-align:right;
  font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
}
.num span{margin-left:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.num.bad{outline:2px solid var(--danger)}
.sub{
  min-width:72px;text-align:right;font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums;padding-right:2px;
}
.sub small{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:1.1}

.add{
  margin-top:12px;width:100%;height:52px;border-radius:var(--r-field);
  border:2px dashed var(--line);color:var(--brand);font-weight:750;font-size:16px;
}
.add:active{background:var(--field)}
.head-l{display:flex;align-items:baseline;gap:8px}
.clear{padding:7px 12px;border-radius:10px;background:var(--field);font-size:14px;font-weight:650;color:var(--muted)}
.clear:hover,.clear:focus-visible{color:var(--ink)}
.clear:active{background:var(--line)}


.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:650;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <h1>계약전력 계산기</h1>
    </div>
    <button class="install" id="install" type="button">앱 설치</button>
  </header>

  <div class="mode" role="radiogroup" aria-label="계산 종류">
    <button type="button" role="radio" data-m="biz">상업용</button>
    <button type="button" role="radio" data-m="home">주거용</button>
  </div>

  <section class="hero" aria-live="polite">
    <p class="label" id="heroLabel">필요 계약 전력</p>
    <div class="big"><output id="need">0</output><span>kW</span></div>
    <div class="bar" id="bar" role="img" aria-label="항목별 일일 소비전력 비율"></div>
    <p class="bar-cap">항목별 일일 소비전력 비율</p>
    <dl class="stats">
      <div><dt>일일 소비전력</dt><dd><span id="daily">0</span><small>kWh/일</small></dd></div>
      <div><dt>월간 소비전력 (30일)</dt><dd><span id="monthly">0</span><small>kWh/월</small></dd></div>
    </dl>
  </section>

  <div class="stack" style="display:grid;gap:14px">
    <section class="card">
      <div class="card-head"><div class="head-l"><h2>사용 항목</h2><span class="hint" id="count"></span></div><button class="clear" id="clear" type="button">모두 비우기</button></div>
      <div class="list" id="list"></div>
      <button class="add" id="add" type="button">항목 추가하기</button>
    </section>

  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const KEY = 'cpc.v1';
  const COLORS = ['#7C6CFF','#FF6B9A','#36D1B2','#FFB547','#4FA3FF','#B28CFF','#FF8A5B','#8BD450'];
  const uid = () => Math.random().toString(36).slice(2, 8);

  const DAYS = 30;
  const MODES = { biz: { name: '상업용', divisor: 450 }, home: { name: '주거용', divisor: 720 } };
  const blank = () => ({ id: uid(), name: '', kw: '', h: '' });
  let state = { mode: 'biz', lists: { biz: [blank()], home: [blank()] } };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved) {
      if (saved.lists) {
        ['biz', 'home'].forEach((k) => { if (Array.isArray(saved.lists[k]) && saved.lists[k].length) state.lists[k] = saved.lists[k]; });
        if (MODES[saved.mode]) state.mode = saved.mode;
      } else if (Array.isArray(saved.items) && saved.items.length) {
        state.lists.biz = saved.items; // 이전 버전 데이터
      }
    }
  } catch (_) {}
  const cur = () => state.lists[state.mode];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {} };

  const $ = (s) => document.querySelector(s);
  const num = (v) => {
    const n = parseFloat(String(v).replace(/,/g, '.').trim());
    return Number.isFinite(n) && n >= 0 ? n : 0;
  };
  const fmt = (n, max = 2) => new Intl.NumberFormat('ko-KR', { maximumFractionDigits: max }).format(n);
  const trunc2 = (n) => Math.floor(n * 100 + 1e-9) / 100; // 반올림 없이 버림
  const color = (i) => COLORS[i % COLORS.length];

  /* 항목 행 */
  const list = $('#list');
  function renderRows() {
    list.innerHTML = '';
    cur().forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'row'; row.dataset.id = it.id;
      row.style.setProperty('--c', color(i));
      row.innerHTML = `
        <span class="dot"></span>
        <input class="name" placeholder="항목 이름" aria-label="항목 이름" autocomplete="off">
        <button class="del" type="button" aria-label="항목 삭제">×</button>
        <div class="meta">
          <label class="num"><input data-k="kw" inputmode="decimal" placeholder="0" aria-label="소비전력(kW)"><span>kW</span></label>
          <label class="num"><input data-k="h" inputmode="decimal" placeholder="0" aria-label="사용시간(시간)"><span>시간</span></label>
          <div class="sub"><span class="subv">0</span><small>kWh/일</small></div>
        </div>`;
      row.querySelector('.name').value = it.name;
      row.querySelector('[data-k=kw]').value = it.kw;
      row.querySelector('[data-k=h]').value = it.h;
      row.querySelector('.name').addEventListener('input', (e) => { it.name = e.target.value; save(); });
      row.querySelectorAll('[data-k]').forEach((inp) =>
        inp.addEventListener('input', (e) => { it[e.target.dataset.k] = e.target.value; update(); }));
      row.querySelector('.del').addEventListener('click', () => {
        state.lists[state.mode] = cur().filter((x) => x.id !== it.id);
        renderRows(); update();
      });
      list.appendChild(row);
    });
  }

  /* 숫자 부드럽게 바꾸기 */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let shown = 0, raf = 0;
  function tween(el, to) {
    cancelAnimationFrame(raf);
    if (reduce) { shown = to; el.textContent = fmt(trunc2(to), 2); return; }
    const from = shown, t0 = performance.now(), dur = 320;
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      shown = from + (to - from) * e;
      el.textContent = fmt(trunc2(shown), 2);
      if (p < 1) raf = requestAnimationFrame(step); else { shown = to; el.textContent = fmt(trunc2(to), 2); }
    };
    raf = requestAnimationFrame(step);
  }

  let last = { need: 0, daily: 0, monthly: 0, days: 0 };
  function update() {
    const days = DAYS, divisor = MODES[state.mode].divisor;
    let daily = 0;
    const subs = cur().map((it) => {
      const kwh = num(it.kw) * Math.min(num(it.h), 24);
      daily += kwh; return kwh;
    });
    const monthly = daily * days;
    const need = monthly / divisor;
    last = { need, daily, monthly, days, divisor };

    // 모드
    document.querySelectorAll('.mode button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.m === state.mode)));
    $('#heroLabel').textContent = `${MODES[state.mode].name} 필요 계약 전력`;

    // 행 값
    list.querySelectorAll('.row').forEach((row, i) => {
      row.querySelector('.subv').textContent = fmt(subs[i], 2);
      const h = row.querySelector('[data-k=h]').closest('.num');
      h.classList.toggle('bad', num(cur()[i].h) > 24);
    });
    $('#count').textContent = `${cur().length}개`;

    // 결과
    tween($('#need'), need);
    $('#daily').textContent = fmt(daily, 2);
    $('#monthly').textContent = fmt(monthly, 2);

    // 비율 바
    const bar = $('#bar');
    bar.innerHTML = '';
    if (daily > 0) {
      subs.forEach((v, i) => {
        if (v <= 0) return;
        const s = document.createElement('i');
        s.style.setProperty('--c', color(i));
        s.style.flexBasis = (v / daily * 100) + '%';
        s.style.flexGrow = v;
        s.title = `${cur()[i].name || '항목'} ${fmt(v / daily * 100, 1)}%`;
        bar.appendChild(s);
      });
    }
    save();
  }

  /* 버튼들 */
  document.querySelectorAll('.mode button').forEach((b) =>
    b.addEventListener('click', () => {
      if (state.mode === b.dataset.m) return;
      state.mode = b.dataset.m;
      renderRows(); update();
    }));
  $('#add').addEventListener('click', () => {
    cur().push(blank());
    renderRows(); update();
    const rows = list.querySelectorAll('.row');
    const r = rows[rows.length - 1];
    r.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
    r.querySelector('.name').focus({ preventScroll: true });
  });
  $('#clear').addEventListener('click', () => {
    state.lists[state.mode] = [blank()];
    renderRows(); update();
    say('모두 비웠어요');
  });

  const toast = $('#toast');
  let tt;
  const say = (msg) => { toast.textContent = msg; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 1800); };

  /* 설치 */
  let deferred;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; $('#install').classList.add('show'); });
  $('#install').addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt(); await deferred.userChoice; deferred = null; $('#install').classList.remove('show');
  });

  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

  renderRows(); update();
})();
</script>
</body>
</html>
